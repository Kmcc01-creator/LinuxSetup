[build-system]
requires = [
    "pdm-backend",
    "setuptools>=45",
    "wheel",
    "Cython>=3.0.0",
    "numpy>=1.21.0",
]
build-backend = "pdm.backend"

[project]
name = "graphics-core"
version = "0.1.0"
description = "Graphics and mathematics core system with advanced dependency management"
requires-python = ">=3.8"
authors = [
    {name = "Your Name", email = "your.email@example.com"},
]
dependencies = [
    # Core dependencies
    "numpy>=1.21.0",
    "scipy>=1.7.0",
    "pydantic>=2.0.0",
    
    # Graphics dependencies
    "PyOpenGL>=3.1.0",
    "PyOpenGL-accelerate>=3.1.0",
    "glfw>=2.5.0",
    
    # Utility dependencies
    "typing-extensions>=4.0.0",
    "rich>=10.0.0",
    "loguru>=0.6.0",
]

[project.optional-dependencies]
vulkan = [
    "vulkan>=1.2.0",
    "vulkan-headers>=1.2.0",
]
cuda = [
    "cupy>=10.0.0",
    "pycuda>=2021.1",
]
test = [
    "pytest>=7.0.0",
    "pytest-cov>=3.0.0",
    "pytest-benchmark>=3.4.0",
]
docs = [
    "sphinx>=4.0.0",
    "sphinx-rtd-theme>=1.0.0",
    "myst-parser>=0.18.0",
]
dev = [
    "black>=22.0.0",
    "ruff>=0.1.0",
    "mypy>=0.990",
    "pre-commit>=2.20.0",
]

[tool.pdm]
package-type = "library"

[tool.pdm.build]
includes = [
    "src/graphics_core",
    "src/*.pyx",
    "src/*.pxd",
]
excludes = [
    "tests",
    "docs",
    "examples",
]
cythonize = true
source-includes = [
    "tests",
    "docs",
    "examples",
]

[tool.pdm.dev-dependencies]
dev = [
    "black>=22.0.0",
    "ruff>=0.1.0",
    "mypy>=0.990",
]

[tool.ruff]
line-length = 88
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "B",  # flake8-bugbear
    "C",  # flake8-comprehensions
    "I",  # isort
]
ignore = [
    "E203",  # Whitespace before ':'
    "E501",  # Line too long
]

[tool.ruff.per-file-ignores]
"__init__.py" = ["F401"]  # Unused imports

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true

[[tool.mypy.overrides]]
module = [
    "numpy.*",
    "scipy.*",
    "OpenGL.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --cov=graphics_core"
testpaths = [
    "tests",
]

[tool.coverage.run]
source = ["src"]
omit = [
    "tests/*",
    "examples/*",
]

[tool.black]
line-length = 88
target-version = ['py38']
include = '\.pyi?$'

# Custom dependency management configuration
[tool.dependencies]
allowed_cycles = []  # No circular dependencies allowed

[[tool.dependencies.rules]]
module = "graphics"
allowed_dependencies = [
    "math.linear",
    "math.geometry",
    "utils.logging",
    "utils.errors",
]

[[tool.dependencies.rules]]
module = "math"
allowed_dependencies = [
    "utils.logging",
    "utils.errors",
]

[tool.dependencies.external]
graphics = [
    "PyOpenGL",
    "glfw",
    "numpy",
]
math = [
    "numpy",
    "scipy",
]
utils = [
    "pydantic",
    "loguru",
]

[tool.cython]
language_level = "3"
annotate = true
compiler_directives = {
    "boundscheck": false,
    "wraparound": false,
    "initializedcheck": false,
    "nonecheck": false,
    "cdivision": true,
}

[tool.automation]
pre_build_hooks = [
    "dependency_validator",
    "mypy",
    "ruff",
]
post_build_hooks = [
    "pytest",
    "dependency_analyzer",
]