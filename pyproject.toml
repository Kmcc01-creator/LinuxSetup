# pyproject.toml
[build-system]
requires = ["hatchling", "meson-python"]
build-backend = "hatchling.build"

[project]
name = "your-project"
version = "0.1.0"
authors = [
  { name = "Your Name", email = "your.email@example.com" },
]
description = "Your project description"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "numpy>=1.20",
    "pillow>=9.0",
]

[tool.hatch.build]
exclude = [
  "/.git",
  "/dist",
  "/.tox",
]

[tool.hatch.envs.default]
dependencies = [
  "pytest",
  "pytest-cov",
  "mypy",
  "black",
]

[tool.hatch.envs.default.scripts]
test = "pytest {args}"
lint = "black ."
type-check = "mypy ."

